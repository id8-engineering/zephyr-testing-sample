sample:
  name: Zephyr Testing Sample
  description: Reference application publishing telemetry records to the log
common:
  harness: console
  harness_config:
    type: multi_line
    ordered: true
    regex:
      - '"seq":0,"uptime_ms":\d+,"temperature_mc":21500,"humidity_mpct":45000'
      - '"seq":1,"uptime_ms":\d+,"temperature_mc":21500,"humidity_mpct":45000'
      - '"seq":2,"uptime_ms":\d+,"temperature_mc":21500,"humidity_mpct":45000'
  # Sample faster than the 10 s default so testing does not need to wait 20 s.
  extra_configs:
    - CONFIG_TELEMETRY_APP_SAMPLE_INTERVAL_MS=1000
tests:
  zephyr_testing_sample.telemetry_log:
    platform_allow:
      - native_sim
      - qemu_cortex_m3
      - seven/nrf9151
    integration_platforms:
      - native_sim
      - qemu_cortex_m3
